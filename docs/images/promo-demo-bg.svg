<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">XXZF 通知流转产品动画背景</title>
  <desc id="desc">Android 通知经过自建 XXZF 服务，到达电脑与 iPhone</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050b12"/><stop offset=".55" stop-color="#0b1424"/><stop offset="1" stop-color="#141329"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18283a" stop-opacity=".92"/><stop offset="1" stop-color="#111a2d" stop-opacity=".86"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2433"/><stop offset="1" stop-color="#19213b"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1035" cy="40" r="270" fill="#4cdbac" opacity=".055"/><circle cx="770" cy="690" r="350" fill="#7869ff" opacity=".065"/>
  <path d="M0 150h1200M0 300h1200M0 450h1200M0 600h1200M150 0v675M300 0v675M450 0v675M600 0v675M750 0v675M900 0v675M1050 0v675" stroke="#ffffff" stroke-width="1" opacity=".018"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <g transform="translate(58 42)"><rect width="112" height="34" rx="17" fill="#45dda5"/><text x="56" y="23" fill="#052119" font-size="17" text-anchor="middle" font-weight="850">XXZF</text></g>
    <text x="58" y="132" fill="#ffffff" font-size="46" font-weight="850">Android 来消息，常用设备一起知道</text>
    <text x="58" y="173" fill="#91a4ba" font-size="21">正文默认隐藏 · 服务由自己部署 · iPhone 通过 Bark 接收</text>
    <g transform="translate(940 46)"><rect width="202" height="34" rx="17" fill="#ffffff" opacity=".055" stroke="#ffffff" stroke-opacity=".1"/><circle cx="20" cy="17" r="5" fill="#4ae0a8"/><text x="111" y="23" fill="#aebed0" font-size="15" text-anchor="middle" font-weight="700" letter-spacing="1">OPEN SOURCE</text></g>

    <path d="M278 385C348 385 356 364 424 364" fill="none" stroke="#52dfaa" stroke-width="3" stroke-linecap="round" opacity=".24"/>
    <path d="M570 345C630 345 646 294 690 294" fill="none" stroke="#6eb8ff" stroke-width="3" stroke-linecap="round" opacity=".24"/>
    <path d="M570 382C680 382 814 445 977 445" fill="none" stroke="#b394ff" stroke-width="3" stroke-linecap="round" opacity=".22"/>

    <g transform="translate(78 210)">
