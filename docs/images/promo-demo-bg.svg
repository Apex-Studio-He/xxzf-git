      <rect x="15" y="49" width="170" height="220" rx="26" fill="url(#screen)"/>
      <rect x="74" y="18" width="52" height="7" rx="4" fill="#273747"/>
      <circle cx="100" cy="303" r="9" fill="#55e1ac"/>
      <g transform="translate(31 82)">
        <rect width="138" height="78" rx="19" fill="#192c3c" stroke="#2d5360" stroke-width="2"/>
        <rect x="12" y="13" width="42" height="42" rx="12" fill="#3bdd99"/><path d="M24 28h18M24 38h22M24 48h14" stroke="#06251c" stroke-width="4" stroke-linecap="round"/>
        <text x="66" y="34" fill="#f1f7fc" font-size="15" font-weight="800">微信</text><text x="66" y="55" fill="#7f93a7" font-size="12">新消息</text>
      </g>
      <text x="100" y="370" fill="#e5fff5" font-size="22" text-anchor="middle" font-weight="800">Android</text>
      <text x="100" y="397" fill="#77988c" font-size="16" text-anchor="middle">只监听你选的 App</text>
    </g>

    <g transform="translate(424 296)">
      <rect width="146" height="138" rx="36" fill="url(#glass)" stroke="#4ee0a7" stroke-opacity=".65" stroke-width="3"/>
      <circle cx="73" cy="55" r="26" fill="#41da9f" opacity=".15"/><path d="M52 55h42M62 43l-12 12 12 12M84 43l12 12-12 12" fill="none" stroke="#56e6af" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
