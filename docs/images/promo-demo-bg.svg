<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">XXZF 通知流转动画背景</title>
  <desc id="desc">Android 通知经过自建服务转发到电脑与 iPhone</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061915"/><stop offset=".52" stop-color="#10243d"/><stop offset="1" stop-color="#281944"/></linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1090" cy="80" r="240" fill="#57e5ad" opacity=".09"/><circle cx="770" cy="710" r="310" fill="#786cff" opacity=".08"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="75" fill="#ffffff" font-size="40" font-weight="800">一条 Android 通知，会去哪里？</text>
    <text x="64" y="116" fill="#91a8be" font-size="20">流程动画 · 不是真机录屏 · 不含真实账号或通知</text>

    <g transform="translate(82 222)">
      <rect width="176" height="344" rx="42" fill="#0d1726" stroke="#57e6ad" stroke-width="5"/>
      <rect x="17" y="52" width="142" height="221" rx="18" fill="#183247"/>
      <rect x="37" y="82" width="102" height="82" rx="16" fill="#244a5d"/>
      <circle cx="58" cy="106" r="10" fill="#50e3aa"/><path d="M78 102h43M48 136h74" stroke="#ddfff3" stroke-width="7" stroke-linecap="round"/>
      <circle cx="88" cy="310" r="10" fill="#57e6ad"/>
      <text x="88" y="390" fill="#e1fff5" font-size="24" text-anchor="middle" font-weight="750">Android</text>
      <text x="88" y="423" fill="#8eb7aa" font-size="18" text-anchor="middle">选中的 App 通知</text>
    </g>

    <path d="M300 386h132" stroke="#49dda4" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 16" opacity=".65"/><path d="M413 369l23 17-23 17" fill="none" stroke="#49dda4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(458 296)">
      <rect width="238" height="178" rx="34" fill="#142d43" stroke="#5adca9" stroke-width="4"/>
      <path d="M55 65h128M55 91h95M55 117h112" stroke="#7bf0c0" stroke-width="8" stroke-linecap="round"/>
      <circle cx="201" cy="42" r="11" fill="#4fe0a7"/>
      <text x="119" y="222" fill="#e0fff3" font-size="24" text-anchor="middle" font-weight="750">你的 XXZF 服务</text>
      <text x="119" y="255" fill="#8eb7aa" font-size="18" text-anchor="middle">配对 · 路由 · 限速</text>
    </g>
    <path d="M722 386h102" stroke="#70bdff" stroke-width="7" stroke-linecap="round" stroke-dasharray="14 16" opacity=".72"/><path d="M805 369l23 17-23 17" fill="none" stroke="#70bdff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <g transform="translate(862 158)">
      <rect width="270" height="174" rx="28" fill="#172f49" stroke="#7bbcff" stroke-width="5"/>
      <rect x="24" y="24" width="222" height="105" rx="12" fill="#294b65"/>
      <path d="M92 210h88M136 174v36" stroke="#7bbcff" stroke-width="8" stroke-linecap="round"/>
      <text x="135" y="257" fill="#e1efff" font-size="24" text-anchor="middle" font-weight="750">Mac / Windows</text>
      <text x="135" y="290" fill="#98b6d6" font-size="18" text-anchor="middle">原生桌面提醒</text>
    </g>
    <g transform="translate(919 372)">
      <rect width="156" height="238" rx="38" fill="#111a2b" stroke="#c4a5ff" stroke-width="5"/>
      <rect x="17" y="48" width="122" height="137" rx="16" fill="#2b3156"/>
      <circle cx="78" cy="210" r="9" fill="#c4a5ff"/>
      <text x="78" y="282" fill="#eee8ff" font-size="24" text-anchor="middle" font-weight="750">iPhone</text>
      <text x="78" y="315" fill="#b4a3d7" font-size="18" text-anchor="middle">通过 Bark</text>
    </g>

    <g transform="translate(64 660)"><rect width="600" height="48" rx="18" fill="#ffffff" opacity=".07"/><circle cx="26" cy="24" r="8" fill="#49e1a7"/><text x="48" y="31" fill="#c8d7e6" font-size="19">默认只显示来源 App 和标题，原始正文不作为 Bark 正文发送</text></g>
  </g>
</svg>
