<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">XXZF 通知转发</title>
  <desc id="desc">将 Android 通知转发到 macOS、Windows 和 iPhone</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a17"/>
      <stop offset="0.55" stop-color="#10233f"/>
      <stop offset="1" stop-color="#241a42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39e6a3"/>
      <stop offset="1" stop-color="#7ab8ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="1010" cy="105" r="145" fill="#42e0a0" opacity=".12" filter="url(#glow)"/>
  <circle cx="915" cy="430" r="175" fill="#7b8cff" opacity=".13" filter="url(#glow)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="72" y="66" width="142" height="40" rx="20" fill="#ffffff" opacity=".1"/>
    <text x="143" y="93" fill="#b8f7dd" font-size="18" text-anchor="middle" font-weight="700">OPEN SOURCE</text>
    <text x="72" y="184" fill="#ffffff" font-size="66" font-weight="800">XXZF · 转发</text>
    <text x="72" y="244" fill="url(#accent)" font-size="35" font-weight="700">把安卓通知，安安静静送到你身边</text>
    <text x="72" y="300" fill="#cad6e6" font-size="23">Mac、Windows、iPhone，一套源码全部照顾到。</text>
    <g transform="translate(72 356)">
      <rect width="180" height="58" rx="18" fill="#35d59b"/>
      <text x="90" y="37" fill="#06251d" font-size="21" text-anchor="middle" font-weight="800">自己部署</text>
      <rect x="196" width="180" height="58" rx="18" fill="#ffffff" opacity=".11"/>
      <text x="286" y="37" fill="#ffffff" font-size="21" text-anchor="middle" font-weight="700">内容可隐藏</text>
      <rect x="392" width="180" height="58" rx="18" fill="#ffffff" opacity=".11"/>
      <text x="482" y="37" fill="#ffffff" font-size="21" text-anchor="middle" font-weight="700">断线会重连</text>
    </g>
    <g transform="translate(785 115)">
      <rect width="112" height="210" rx="24" fill="#111827" stroke="#8eeac8" stroke-width="3"/>
      <rect x="10" y="28" width="92" height="150" rx="12" fill="#1c3141"/>
      <circle cx="56" cy="194" r="7" fill="#8eeac8"/>
      <path d="M44 91h24M44 108h38M44 125h30" stroke="#8eeac8" stroke-width="6" stroke-linecap="round"/>
      <path d="M121 104h72" stroke="#72d9b1" stroke-width="5" stroke-linecap="round"/>
      <path d="M182 92l14 12-14 12" fill="none" stroke="#72d9b1" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="205" y="35" width="130" height="92" rx="18" fill="#142f47" stroke="#7ab8ff" stroke-width="3"/>
      <rect x="220" y="53" width="100" height="58" rx="7" fill="#263f59"/>
      <path d="M238 145h64M270 128v17" stroke="#7ab8ff" stroke-width="5" stroke-linecap="round"/>
      <rect x="225" y="170" width="92" height="46" rx="13" fill="#ffffff" opacity=".1"/>
      <text x="271" y="199" fill="#d9e7f8" font-size="17" text-anchor="middle">Mac / PC</text>
    </g>
  </g>
</svg>
