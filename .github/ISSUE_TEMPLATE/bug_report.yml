name: Bug 报告
description: 报告能够安全复现的程序问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实服务器地址、通知正文、设备标识、Bark Key、Token、证书、私钥、数据库或完整日志。安全漏洞请按 SECURITY.md 私密报告。
  - type: dropdown
    id: component
    attributes:
      label: 相关组件
      options:
        - Android
        - Python 服务端
        - Bark 绑定页 / iPhone
        - macOS
        - Windows
        - 部署或文档
        - Codex 构建流程
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或 commit
      placeholder: v0.1.0 或 commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 只写系统版本、设备类型和公开依赖版本，不写设备序列号或真实域名。
      placeholder: Android 15 / macOS 15 / Python 3.12 等
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 使用示例地址或脱敏环境描述最小复现步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues / Discussions，没有发现同一问题。
          required: true
        - label: 我没有附上凭据、私人通知、设备标识或真实生产数据。
          required: true
        - label: 这不是需要私密报告的安全漏洞。
          required: true
