name: 功能建议
description: 提议一个有明确使用场景的改进
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 建议先在 Discussions 交流尚未成形的想法；已经明确的问题和方案可以使用此模板。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      description: 请描述真实使用场景，不要只写希望增加某个按钮。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: privacy
    attributes:
      label: 是否会新增网络请求或处理更多通知内容？
      options:
        - 不会
        - 可能会，需要讨论安全边界
        - 不确定
    validations:
      required: true
